name: Link check

# Real network link checking runs on a schedule and on demand only — never on
# every pull request — so third-party outages never block unrelated changes.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  links:
    name: Check catalog links
    runs-on: ubuntu-latest
    steps:
      # actions pinned to a full commit SHA (verified against the official tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check links
        run: npm run links:check
