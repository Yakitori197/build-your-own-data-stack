name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never send Astro's anonymous build-tool telemetry from CI.
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Minimum supported version (exact) and current Node.
        node: ['22.13.0', 24]
    steps:
      # actions pinned to a full commit SHA (verified against the official tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Validate catalog
        run: npm run catalog:validate

      - name: Generated artifacts are up to date
        run: |
          npm run catalog:generate
          git diff --exit-code -- README.md public/api/catalog.json

      - name: Build site
        run: npm run build

      - name: Audit (production dependencies)
        run: npm audit --omit=dev

      - name: Audit (all dependencies)
        run: npm audit
