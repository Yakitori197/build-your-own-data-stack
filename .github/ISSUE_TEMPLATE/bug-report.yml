name: 🐛 Bug report
description: Report a problem with the site, tooling, or a catalog entry.
title: 'bug: <summary>'
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      description: Page URL, script name, or catalog entry slug.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version (`node --version`), and browser if relevant.
    validations:
      required: false
